name: collect-and-publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = 전체 수집, trending-only = 기존 당일 관측을 유지하고 TRENDING만 추가"
        type: choice
        options:
          - daily
          - trending-only
        default: daily
  schedule:
    # 매일 00:10 KST 요청. GitHub 예약 실행은 지연될 수 있음.
    - cron: "10 15 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zeta-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore collector state
        uses: actions/cache/restore@v4
        with:
          path: data/zeta.sqlite3
          key: zeta-db-${{ github.run_id }}
          restore-keys: |
            zeta-db-

      - name: Collect public Zeta metrics
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'daily' }}
        run: |
          if [ "$RUN_MODE" = "trending-only" ]; then
            python scripts/collect.py --trending-only
          else
            python scripts/collect.py --max-tag-pages 120 --max-plot-refresh 3000 --max-comment-plots 250 --infinite-pages 8
          fi

      - name: Backfill a small Wayback batch
        if: inputs.mode != 'trending-only'
        continue-on-error: true
        run: python scripts/backfill_wayback.py --limit 1 --delay 0.25

      - name: Verify output
        run: python -m unittest scripts/test_collect.py

      - name: Save collector state
        uses: actions/cache/save@v4
        with:
          path: data/zeta.sqlite3
          key: zeta-db-${{ github.run_id }}

      - name: Assemble site
        run: |
          mkdir site
          cp index.html site/index.html
          cp -R public site/public
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preserve public snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zeta-public-data-${{ github.run_number }}
          path: public/data
          retention-days: 90

      - name: Preserve collector database
        uses: actions/upload-artifact@v4
        with:
          name: zeta-db-${{ github.run_number }}
          path: data/zeta.sqlite3
          retention-days: 90

      - name: Keep scheduled workflow active
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Asia/Seoul date +%d)" != "01" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep daily collector active [skip ci]"
          git push origin HEAD:main
